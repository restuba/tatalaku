name: Release

# Build and push the API container image to GitHub Container Registry (GHCR)
# on every push to main.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Image name is derived from the repository owner; must be lowercase for GHCR.
  IMAGE_NAME: ${{ github.repository_owner }}/tatalaku-api

jobs:
  build-and-push-api:
    name: Build & push API image
    runs-on: ubuntu-latest

    # Grant the workflow permission to push packages to GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Enables advanced build features and layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR using the built-in token (no manual secret needed).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags and labels automatically.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build from the monorepo root (Dockerfile uses `COPY . .`) and push.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
